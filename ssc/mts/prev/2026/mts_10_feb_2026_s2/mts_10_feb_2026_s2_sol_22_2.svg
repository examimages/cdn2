<svg width="691" height="150" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 350"   style="font-size: 24px; background-color: #ffffff;">
    <defs>
        <style>
            .node {
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                font-size: 36px;
                font-weight: 700;
                fill: #000000;
                text-anchor: middle;
            }
            .label {
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                font-size: 24px;
                font-weight: 600;
                fill: #000000;
                text-anchor: middle;
            }
            .connector {
                fill: none;
                stroke: #000000;
                stroke-width: 2.5;
            }
            .shape {
                fill: #ffffff;
                stroke: #000000;
                stroke-width: 2.5;
            }
        </style>
        
        <!-- Arrowhead Marker -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 L 2.5 5 z" fill="#000000" />
        </marker>

        <!-- Subtle Drop Shadow for a modern professional look -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1" flood-color="#000000"/>
        </filter>
    </defs>

    <!-- Connectors -->
    <g class="connector" filter="url(#shadow)">
        <!-- Top Connectors (+3 Intervals) -->
        <path d="M 250 160 L 250 110 Q 250 100 260 100 L 390 100 Q 400 100 400 110 L 400 148" marker-end="url(#arrow)" />
        <path d="M 550 160 L 550 110 Q 550 100 560 100 L 690 100 Q 700 100 700 110 L 700 160" marker-end="url(#arrow)" />
        <path d="M 850 160 L 850 110 Q 850 100 860 100 L 990 100 Q 1000 100 1000 110 L 1000 160" marker-end="url(#arrow)" />
        <path d="M 1150 160 L 1150 110 Q 1150 100 1160 100 L 1290 100 Q 1300 100 1300 110 L 1300 160" marker-end="url(#arrow)" />

        <!-- Bottom Connectors (+2 Intervals) -->
        <path d="M 100 215 L 100 260 Q 100 270 110 270 L 240 270 Q 250 270 250 260 L 250 215" marker-end="url(#arrow)" />
        <path d="M 400 225 L 400 260 Q 400 270 410 270 L 540 270 Q 550 270 550 260 L 550 215" marker-end="url(#arrow)" />
        <path d="M 700 215 L 700 260 Q 700 270 710 270 L 840 270 Q 850 270 850 260 L 850 215" marker-end="url(#arrow)" />
        <path d="M 1000 215 L 1000 260 Q 1000 270 1010 270 L 1140 270 Q 1150 270 1150 260 L 1150 215" marker-end="url(#arrow)" />
    </g>

    <!-- Node Shapes -->
    <circle class="shape" cx="400" cy="188" r="32" filter="url(#shadow)" />

    <!-- Sequence Nodes -->
    <g class="node">
        <text x="100" y="202">N</text>
        <text x="250" y="202">P</text>
        <text x="400" y="202">S</text>
        <text x="550" y="202">U</text>
        <text x="700" y="202">X</text>
        <text x="850" y="202">Z</text>
        <text x="1000" y="202">C</text>
        <text x="1150" y="202">E</text>
        <text x="1300" y="202">H</text>
    </g>

    <!-- Interval Labels -->
    <g class="label">
        <text x="325" y="85">+3</text>
        <text x="625" y="85">+3</text>
        <text x="925" y="85">+3</text>
        <text x="1225" y="85">+3</text>

        <text x="175" y="310">+2</text>
        <text x="475" y="310">+2</text>
        <text x="775" y="310">+2</text>
        <text x="1075" y="310">+2</text>
    </g>
</svg>