<svg width="198" height="107" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"   style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 24px;">
  
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    
    <!-- Subtle Drop Shadow for modern professional look -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Node Shapes -->
  <g stroke="#000000" stroke-width="2" fill="#ffffff" filter="url(#shadow)">
    <!-- Top Row -->
    <rect x="90" y="50" width="60" height="60" rx="14" />
    <rect x="230" y="50" width="60" height="60" rx="14" />
    <rect x="370" y="50" width="60" height="60" rx="14" />

    <!-- Bottom Row -->
    <rect x="90" y="230" width="60" height="60" rx="14" />
    <rect x="230" y="230" width="60" height="60" rx="14" />
    <rect x="370" y="230" width="60" height="60" rx="14" />
  </g>

  <!-- Node Labels (Letters) -->
  <g fill="#000000" font-weight="bold" font-size="28px" text-anchor="middle" dominant-baseline="central">
    <!-- Top Row -->
    <text x="120" y="82">H</text>
    <text x="260" y="82">N</text>
    <text x="400" y="82">P</text>

    <!-- Bottom Row -->
    <text x="120" y="262">C</text>
    <text x="260" y="262">I</text>
    <text x="400" y="262">K</text>
  </g>

  <!-- Connector Lines with Arrowheads -->
  <g stroke="#000000" stroke-width="3" marker-end="url(#arrow)">
    <line x1="120" y1="125" x2="120" y2="212" />
    <line x1="260" y1="125" x2="260" y2="212" />
    <line x1="400" y1="125" x2="400" y2="212" />
  </g>

  <!-- Connector Labels (-5 Shift) -->
  <g fill="#000000" font-family="monospace, sans-serif" font-weight="bold" font-size="22px" text-anchor="start" dominant-baseline="central">
    <text x="138" y="168">-5</text>
    <text x="278" y="168">-5</text>
    <text x="418" y="168">-5</text>
  </g>

</svg>