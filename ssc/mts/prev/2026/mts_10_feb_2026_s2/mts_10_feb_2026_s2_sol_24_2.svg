<svg width="230" height="104" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"  >
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M 0 1 L 8 5 L 0 9 Z" fill="#000000" />
        </marker>
    </defs>
    
    <style>
        text {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #000000;
            font-size: 24px;
        }
        .letter {
            font-size: 56px;
            font-weight: 700;
        }
        .label {
            font-size: 32px;
            font-weight: 600;
            text-anchor: start;
        }
        .connector {
            stroke: #000000;
            stroke-width: 4;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>

    <rect width="100%" height="100%" fill="#ffffff" />

    <!-- Column 1 -->
    <text x="150" y="80" class="letter">W</text>
    <line x1="150" y1="130" x2="150" y2="260" class="connector" marker-end="url(#arrow)" />
    <text x="180" y="195" class="label">+5</text>
    <text x="150" y="320" class="letter">B</text>

    <!-- Column 2 -->
    <text x="300" y="80" class="letter">K</text>
    <line x1="300" y1="130" x2="300" y2="260" class="connector" marker-end="url(#arrow)" />
    <text x="330" y="195" class="label">+5</text>
    <text x="300" y="320" class="letter">P</text>

    <!-- Column 3 -->
    <text x="450" y="80" class="letter">J</text>
    <line x1="450" y1="130" x2="450" y2="260" class="connector" marker-end="url(#arrow)" />
    <text x="480" y="195" class="label">+5</text>
    <text x="450" y="320" class="letter">O</text>
</svg>