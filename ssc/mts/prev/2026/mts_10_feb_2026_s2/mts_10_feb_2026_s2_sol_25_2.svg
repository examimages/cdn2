<svg width="697" height="136" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
    </marker>
  </defs>

  <!-- Background for clarity -->
  <rect width="100%" height="100%" fill="#fff" />

  <!-- Vertical Selection Box -->
  <rect x="735" y="45" width="60" height="310" fill="none" stroke="#000" stroke-width="2" rx="4" />

  <!-- Row 1: N(+2)P(+2)R(+2)T(+2)V(+2)X(+2)Z(+2)B -->
  <g font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#000">
    <!-- Letters Row 1 -->
    <text x="50" y="105">N</text>
    <text x="170" y="105">P</text>
    <text x="290" y="105">R</text>
    <text x="410" y="105">T</text>
    <text x="530" y="105">V</text>
    <text x="650" y="105">X</text>
    <text x="765" y="105">Z</text>
    <text x="890" y="105">B</text>

    <!-- Connectors and Labels Row 1 -->
    <line x1="75" y1="95" x2="140" y2="95" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <text x="107" y="80" font-size="20">+2</text>

    <line x1="195" y1="95" x2="260" y2="95" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <text x="227" y="80" font-size="20">+2</text>

    <line x1="315" y1="95" x2="380" y2="95" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <text x="347" y="80" font-size="20">+2</text>

    <line x1="435" y1="95" x2="500" y2="95" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <text x="467" y="80" font-size="20">+2</text>

    <line x1="555" y1="95" x2="620" y2="95" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <text x="587" y="80" font-size="20">+2</text>

    <line x1="675" y1="95" x2="735" y2="95" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <text x="707" y="80" font-size="20">+2</text>

    <line x1="795" y1="95" x2="860" y2="95" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <text x="827" y="80" font-size="20">+2</text>
  </g>

  <!-- Row 2: Z(+2)B(+3)E(+4)I(+5)N(+6)T(+7)A(+8)I -->
  <g font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#000">
    <!-- Letters Row 2 -->
    <text x="50" y="305">Z</text>
    <text x="170" y="305">B</text>
    <text x="290" y="305">E</text>
    <text x="410" y="305">I</text>
    <text x="530" y="305">N</text>
    <text x="650" y="305">T</text>
    <text x="765" y="305">A</text>
    <text x="890" y="305">I</text>

    <!-- Connectors and Labels Row 2 -->
    <line x1="75" y1="295" x2="140" y2="295" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <text x="107" y="280" font-size="20">+2</text>

    <line x1="195" y1="295" x2="260" y2="295" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <text x="227" y="280" font-size="20">+3</text>

    <line x1="315" y1="295" x2="380" y2="295" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <text x="347" y="280" font-size="20">+4</text>

    <line x1="435" y1="295" x2="500" y2="295" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <text x="467" y="280" font-size="20">+5</text>

    <line x1="555" y1="295" x2="620" y2="295" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <text x="587" y="280" font-size="20">+6</text>

    <line x1="675" y1="295" x2="735" y2="295" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <text x="707" y="280" font-size="20">+7</text>

    <line x1="795" y1="295" x2="860" y2="295" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <text x="827" y="280" font-size="20">+8</text>
  </g>
</svg>