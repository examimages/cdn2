<svg width="382" height="160" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520"  >
    <defs>
        <!-- Standard Arrowhead Marker -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#000000" />
        </marker>
        
        <!-- Drop Shadow Filter for Nodes -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
        </filter>
    </defs>

    <style>
        /* Base typography configuration */
        text {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 24px;
            fill: #000000;
        }
        
        /* Node text specific styling */
        .node-text {
            font-weight: 700;
            font-size: 26px;
        }
        
        /* Edge label styling */
        .edge-label {
            font-weight: 600;
            font-size: 22px;
        }
        
        /* Halo effect for edge labels to ensure readability over lines */
        .label-halo {
            stroke: #ffffff;
            stroke-width: 6px;
            stroke-linejoin: round;
            fill: none;
        }

        /* Node shapes styling */
        .node-rect {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2.5;
        }

        /* Connector lines styling */
        .edge-line {
            stroke: #000000;
            stroke-width: 2.5;
            fill: none;
        }
    </style>

    <!-- CONNECTIONS (Drawn behind nodes to keep borders clean) -->
    <!-- T to bottom S (-1) -->
    <line x1="200" y1="130" x2="600" y2="370" class="edge-line" marker-end="url(#arrow)" />
    
    <!-- Top S to Q (-2) -->
    <line x1="400" y1="130" x2="400" y2="370" class="edge-line" marker-end="url(#arrow)" />

    <!-- R to O (-3) -->
    <line x1="600" y1="130" x2="200" y2="370" class="edge-line" marker-end="url(#arrow)" />

    <!-- 60 to 90 (x 1.5) -->
    <line x1="800" y1="130" x2="800" y2="370" class="edge-line" marker-end="url(#arrow)" />

    <!-- Bottom faint output arrows -->
    <line x1="200" y1="440" x2="200" y2="480" class="edge-line" marker-end="url(#arrow)" />
    <line x1="400" y1="440" x2="400" y2="480" class="edge-line" marker-end="url(#arrow)" />
    <line x1="600" y1="440" x2="600" y2="480" class="edge-line" marker-end="url(#arrow)" />
    <line x1="800" y1="440" x2="800" y2="480" class="edge-line" marker-end="url(#arrow)" />

    <!-- TOP ROW NODES -->
    <g filter="url(#shadow)">
        <rect x="160" y="70" width="80" height="60" rx="12" class="node-rect" />
        <text x="200" y="103" text-anchor="middle" dominant-baseline="middle" class="node-text">T</text>
    </g>
    <g filter="url(#shadow)">
        <rect x="360" y="70" width="80" height="60" rx="12" class="node-rect" />
        <text x="400" y="103" text-anchor="middle" dominant-baseline="middle" class="node-text">S</text>
    </g>
    <g filter="url(#shadow)">
        <rect x="560" y="70" width="80" height="60" rx="12" class="node-rect" />
        <text x="600" y="103" text-anchor="middle" dominant-baseline="middle" class="node-text">R</text>
    </g>
    <g filter="url(#shadow)">
        <rect x="760" y="70" width="80" height="60" rx="12" class="node-rect" />
        <text x="800" y="103" text-anchor="middle" dominant-baseline="middle" class="node-text">60</text>
    </g>

    <!-- BOTTOM ROW NODES -->
    <g filter="url(#shadow)">
        <rect x="160" y="370" width="80" height="60" rx="12" class="node-rect" />
        <text x="200" y="403" text-anchor="middle" dominant-baseline="middle" class="node-text">O</text>
    </g>
    <g filter="url(#shadow)">
        <rect x="360" y="370" width="80" height="60" rx="12" class="node-rect" />
        <text x="400" y="403" text-anchor="middle" dominant-baseline="middle" class="node-text">Q</text>
    </g>
    <g filter="url(#shadow)">
        <rect x="560" y="370" width="80" height="60" rx="12" class="node-rect" />
        <text x="600" y="403" text-anchor="middle" dominant-baseline="middle" class="node-text">S</text>
    </g>
    <g filter="url(#shadow)">
        <rect x="760" y="370" width="80" height="60" rx="12" class="node-rect" />
        <text x="800" y="403" text-anchor="middle" dominant-baseline="middle" class="node-text">90</text>
    </g>

    <!-- EDGE LABELS -->
    <g>
        <!-- Label: -1 -->
        <text x="280" y="155" text-anchor="middle" class="edge-label label-halo">-1</text>
        <text x="280" y="155" text-anchor="middle" class="edge-label">-1</text>
        
        <!-- Label: -2 -->
        <text x="420" y="180" text-anchor="start" class="edge-label label-halo">-2</text>
        <text x="420" y="180" text-anchor="start" class="edge-label">-2</text>
        
        <!-- Label: -3 -->
        <text x="520" y="155" text-anchor="middle" class="edge-label label-halo">-3</text>
        <text x="520" y="155" text-anchor="middle" class="edge-label">-3</text>
        
        <!-- Label: x1.5 -->
        <text x="820" y="250" text-anchor="start" dominant-baseline="middle" class="edge-label label-halo">x 1.5</text>
        <text x="820" y="250" text-anchor="start" dominant-baseline="middle" class="edge-label">x 1.5</text>
    </g>
</svg>