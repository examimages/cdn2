<svg width="426" height="161" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400"  >
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000" />
    </marker>
    <!-- Subtle drop shadow to beautify typography -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Main Container -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="24px" text-anchor="middle">

    <!-- Connectors / Lines -->
    <!-- Mathematically centered from node boundaries to node boundaries -->
    <g stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
      <!-- Line: W to V -->
      <line x1="195" y1="130" x2="397.5" y2="265" />
      <!-- Line: K to I -->
      <line x1="300" y1="130" x2="300" y2="265" />
      <!-- Line: U to R -->
      <line x1="405" y1="130" x2="202.5" y2="265" />
      <!-- Line: 100 to 150 -->
      <line x1="650" y1="130" x2="650" y2="265" />
    </g>

    <!-- Node Labels (Top Row) -->
    <g font-size="36px" font-weight="700" fill="#000000" filter="url(#shadow)">
      <text x="150" y="100">W</text>
      <text x="300" y="100">K</text>
      <text x="450" y="100">U</text>
      <text x="650" y="100">100</text>
    </g>

    <!-- Node Labels (Bottom Row) -->
    <g font-size="36px" font-weight="700" fill="#000000" filter="url(#shadow)">
      <text x="150" y="310">R</text>
      <text x="300" y="310">I</text>
      <text x="450" y="310">V</text>
      <text x="650" y="310">150</text>
    </g>

    <!-- Modifier / Edge Labels -->
    <g font-weight="600" fill="#000000">
      <text x="230" y="150">-1</text>
      <text x="325" y="155" text-anchor="start">-2</text>
      <text x="375" y="180">-3</text>
      <text x="670" y="205" text-anchor="start">x 1.5</text>
    </g>

  </g>
</svg>