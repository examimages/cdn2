<svg width="294" height="173"   viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Define marker for arrowheads -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Top Row Labels -->
  <text x="100" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24px" font-weight="bold">Z</text>
  <text x="300" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24px" font-weight="bold">V</text>
  <text x="500" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24px" font-weight="bold">T</text>
  <text x="700" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24px" font-weight="bold">80</text>

  <!-- Bottom Row Labels -->
  <text x="100" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="24px" font-weight="bold">Q</text>
  <text x="300" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="24px" font-weight="bold">T</text>
  <text x="500" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="24px" font-weight="bold">Y</text>
  <text x="700" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="24px" font-weight="bold">120</text>

  <!-- Connector Lines with Arrows -->
  <!-- Line from Z to Y -->
  <line x1="115" y1="100" x2="485" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Line from V to T (bottom) -->
  <line x1="300" y1="100" x2="300" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Line from T (top) to Q -->
  <line x1="485" y1="100" x2="115" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Line from 80 to 120 -->
  <line x1="700" y1="100" x2="700" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Operation Labels on/near lines -->
  <!-- Label -1 near start of Z->Y line -->
  <text x="170" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="24px">-1</text>
  
  <!-- Label -2 near start of V->T line -->
  <text x="330" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="24px">-2</text>
  
  <!-- Label -3 near start of T->Q line -->
  <text x="470" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="24px">-3</text>
  
  <!-- Label x1.5 near vertical 80->120 line -->
  <text x="760" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="24px">× 1.5</text>
</svg>