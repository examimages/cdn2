<svg width="664" height="163" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320"  >
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
    
    <!-- Subtle Drop Shadow for circled words -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Global Styling Group -->
  <g font-family="system-ui, -apple-system, Arial, sans-serif" font-size="24px" font-weight="500" fill="#000000" text-anchor="middle">

    <!-- ==================== LINE 1 ==================== -->
    
    <text x="120" y="100">bike</text>
    <text x="210" y="100">race</text>
    <text x="280" y="100">is</text>

    <!-- Circled Word: excited -->
    <ellipse cx="390" cy="92" rx="55" ry="30" fill="#ffffff" stroke="#000000" stroke-width="2" filter="url(#shadow)"/>
    <text x="390" y="100">excited</text>

    <!-- Arrow -->
    <line x1="480" y1="92" x2="560" y2="92" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="620" y="100">la</text>
    <text x="690" y="100">me</text>

    <!-- Circled Word: na -->
    <ellipse cx="770" cy="92" rx="35" ry="30" fill="#ffffff" stroke="#000000" stroke-width="2" filter="url(#shadow)"/>
    <text x="770" y="100">na</text>

    <text x="850" y="100">fs</text>

    <!-- ==================== LINE 2 ==================== -->
    
    <!-- Circled Word: excited -->
    <ellipse cx="120" cy="222" rx="55" ry="30" fill="#ffffff" stroke="#000000" stroke-width="2" filter="url(#shadow)"/>
    <text x="120" y="230">excited</text>

    <text x="230" y="230">people</text>
    <text x="320" y="230">buy</text>
    <text x="410" y="230">ticket</text>

    <!-- Arrow -->
    <line x1="480" y1="222" x2="560" y2="222" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="620" y="230">mf</text>

    <!-- Circled Word: na -->
    <ellipse cx="700" cy="222" rx="35" ry="30" fill="#ffffff" stroke="#000000" stroke-width="2" filter="url(#shadow)"/>
    <text x="700" y="230">na</text>

    <text x="780" y="230">lz</text>
    <text x="860" y="230">pq</text>

  </g>
</svg>