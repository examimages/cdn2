<svg width="357" height="115" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
    <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
        </marker>
    </defs>
    <style>
        text {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 24px;
            text-anchor: middle;
            fill: #000000;
        }
        .node {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2;
            filter: url(#shadow);
        }
        .node-text {
            font-size: 32px;
            font-weight: 700;
        }
        .line {
            stroke: #000000;
            stroke-width: 2;
            fill: none;
        }
        .label-text {
            font-size: 24px;
            font-weight: 600;
        }
    </style>

    <!-- Column 1 -->
    <!-- Top Node -->
    <rect x="65" y="65" width="70" height="70" rx="16" class="node" />
    <text x="100" y="111" class="node-text">M</text>
    <!-- Arrow -->
    <line x1="100" y1="145" x2="100" y2="245" class="line" marker-end="url(#arrow)" />
    <text x="145" y="203" class="label-text">+1</text>
    <!-- Bottom Node -->
    <rect x="65" y="265" width="70" height="70" rx="16" class="node" />
    <text x="100" y="311" class="node-text">N</text>

    <!-- Column 2 -->
    <!-- Top Node -->
    <rect x="265" y="65" width="70" height="70" rx="16" class="node" />
    <text x="300" y="111" class="node-text">O</text>
    <!-- Arrow -->
    <line x1="300" y1="145" x2="300" y2="245" class="line" marker-end="url(#arrow)" />
    <text x="345" y="203" class="label-text">+2</text>
    <!-- Bottom Node -->
    <rect x="265" y="265" width="70" height="70" rx="16" class="node" />
    <text x="300" y="311" class="node-text">Q</text>

    <!-- Column 3 -->
    <!-- Top Node -->
    <rect x="465" y="65" width="70" height="70" rx="16" class="node" />
    <text x="500" y="111" class="node-text">O</text>
    <!-- Arrow -->
    <line x1="500" y1="145" x2="500" y2="245" class="line" marker-end="url(#arrow)" />
    <text x="545" y="203" class="label-text">+5</text>
    <!-- Bottom Node -->
    <rect x="465" y="265" width="70" height="70" rx="16" class="node" />
    <text x="500" y="311" class="node-text">T</text>

    <!-- Column 4 -->
    <!-- Top Node -->
    <rect x="665" y="65" width="70" height="70" rx="16" class="node" />
    <text x="700" y="111" class="node-text">N</text>
    <!-- Arrow -->
    <line x1="700" y1="145" x2="700" y2="245" class="line" marker-end="url(#arrow)" />
    <text x="745" y="203" class="label-text">-2</text>
    <!-- Bottom Node -->
    <rect x="665" y="265" width="70" height="70" rx="16" class="node" />
    <text x="700" y="311" class="node-text">L</text>

    <!-- Column 5 -->
    <!-- Top Node -->
    <rect x="865" y="65" width="70" height="70" rx="16" class="node" />
    <text x="900" y="111" class="node-text">S</text>
    <!-- Arrow -->
    <line x1="900" y1="145" x2="900" y2="245" class="line" marker-end="url(#arrow)" />
    <text x="945" y="203" class="label-text">-5</text>
    <!-- Bottom Node -->
    <rect x="865" y="265" width="70" height="70" rx="16" class="node" />
    <text x="900" y="311" class="node-text">N</text>
</svg>