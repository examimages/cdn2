<svg width="331" height="142" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400"   style="background-color: #FFFFFF; font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', sans-serif; font-size: 24px;">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#000000" />
    </marker>
    <!-- Subtle Modern Drop Shadow for Nodes -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.12" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Connectors (Arrows) -->
  <g stroke="#000000" stroke-width="2.5" stroke-linecap="round">
    <line x1="100" y1="140" x2="100" y2="250" marker-end="url(#arrow)" />
    <line x1="250" y1="140" x2="250" y2="250" marker-end="url(#arrow)" />
    <line x1="400" y1="140" x2="400" y2="250" marker-end="url(#arrow)" />
    <line x1="550" y1="140" x2="550" y2="250" marker-end="url(#arrow)" />
    <line x1="700" y1="140" x2="700" y2="250" marker-end="url(#arrow)" />
  </g>

  <!-- Transformation Labels -->
  <g fill="#000000" font-weight="600" font-size="24px">
    <text x="115" y="195" dy=".35em">+1</text>
    <text x="265" y="195" dy=".35em">+2</text>
    <text x="415" y="195" dy=".35em">+5</text>
    <text x="565" y="195" dy=".35em">-2</text>
    <text x="715" y="195" dy=".35em">-5</text>
  </g>

  <!-- Top Row Nodes -->
  <g>
    <!-- T -->
    <rect x="60" y="60" width="80" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" filter="url(#shadow)" />
    <text x="100" y="100" dy=".35em" font-size="36px" font-weight="bold" fill="#000000" text-anchor="middle">T</text>
    
    <!-- E -->
    <rect x="210" y="60" width="80" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" filter="url(#shadow)" />
    <text x="250" y="100" dy=".35em" font-size="36px" font-weight="bold" fill="#000000" text-anchor="middle">E</text>
    
    <!-- R -->
    <rect x="360" y="60" width="80" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" filter="url(#shadow)" />
    <text x="400" y="100" dy=".35em" font-size="36px" font-weight="bold" fill="#000000" text-anchor="middle">R</text>
    
    <!-- M -->
    <rect x="510" y="60" width="80" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" filter="url(#shadow)" />
    <text x="550" y="100" dy=".35em" font-size="36px" font-weight="bold" fill="#000000" text-anchor="middle">M</text>
    
    <!-- S -->
    <rect x="660" y="60" width="80" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" filter="url(#shadow)" />
    <text x="700" y="100" dy=".35em" font-size="36px" font-weight="bold" fill="#000000" text-anchor="middle">S</text>
  </g>

  <!-- Bottom Row Nodes -->
  <g>
    <!-- U -->
    <rect x="60" y="260" width="80" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" filter="url(#shadow)" />
    <text x="100" y="300" dy=".35em" font-size="36px" font-weight="bold" fill="#000000" text-anchor="middle">U</text>
    
    <!-- G -->
    <rect x="210" y="260" width="80" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" filter="url(#shadow)" />
    <text x="250" y="300" dy=".35em" font-size="36px" font-weight="bold" fill="#000000" text-anchor="middle">G</text>
    
    <!-- W -->
    <rect x="360" y="260" width="80" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" filter="url(#shadow)" />
    <text x="400" y="300" dy=".35em" font-size="36px" font-weight="bold" fill="#000000" text-anchor="middle">W</text>
    
    <!-- K -->
    <rect x="510" y="260" width="80" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" filter="url(#shadow)" />
    <text x="550" y="300" dy=".35em" font-size="36px" font-weight="bold" fill="#000000" text-anchor="middle">K</text>
    
    <!-- N -->
    <rect x="660" y="260" width="80" height="80" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" filter="url(#shadow)" />
    <text x="700" y="300" dy=".35em" font-size="36px" font-weight="bold" fill="#000000" text-anchor="middle">N</text>
  </g>
</svg>