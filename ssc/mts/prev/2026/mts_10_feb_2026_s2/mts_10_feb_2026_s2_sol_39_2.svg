<svg width="674" height="223" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650"   style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-size: 24px;">
    <defs>
        <!-- Arrowhead Marker Definition -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000" />
        </marker>
    </defs>

    <g text-anchor="middle" dominant-baseline="middle">
        
        <!-- ================= ROW 1: +2 SEQUENCE ================= -->
        <!-- Nodes -->
        <text x="150" y="150" font-size="28px" font-weight="bold" fill="#000000">T</text>
        <text x="310" y="150" font-size="28px" font-weight="bold" fill="#000000">V</text>
        <text x="470" y="150" font-size="28px" font-weight="bold" fill="#000000">X</text>
        <text x="630" y="150" font-size="28px" font-weight="bold" fill="#000000">Z</text>
        <text x="790" y="150" font-size="28px" font-weight="bold" fill="#000000">B</text>
        <!-- Crossed-out mistake -->
        <text x="885" y="150" font-size="22px" fill="#888888" text-decoration="line-through">E</text>
        <text x="950" y="150" font-size="28px" font-weight="bold" fill="#000000">D</text>

        <!-- Connections & Labels -->
        <line x1="170" y1="150" x2="290" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
        <text x="230" y="120" font-size="20px" fill="#000000">+2</text>

        <line x1="330" y1="150" x2="450" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
        <text x="390" y="120" font-size="20px" fill="#000000">+2</text>

        <line x1="490" y1="150" x2="610" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
        <text x="550" y="120" font-size="20px" fill="#000000">+2</text>

        <line x1="650" y1="150" x2="770" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
        <text x="710" y="120" font-size="20px" fill="#000000">+2</text>

        <line x1="810" y1="150" x2="865" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
        <text x="837" y="120" font-size="20px" fill="#000000">+2</text>


        <!-- ================= ROW 2: -4 SEQUENCE ================= -->
        <!-- Nodes -->
        <text x="150" y="300" font-size="28px" font-weight="bold" fill="#000000">S</text>
        <text x="310" y="300" font-size="28px" font-weight="bold" fill="#000000">O</text>
        <text x="470" y="300" font-size="28px" font-weight="bold" fill="#000000">K</text>
        <text x="630" y="300" font-size="28px" font-weight="bold" fill="#000000">G</text>
        <text x="790" y="300" font-size="28px" font-weight="bold" fill="#000000">C</text>
        <!-- Crossed-out mistake -->
        <text x="885" y="300" font-size="22px" fill="#888888" text-decoration="line-through">X</text>
        <text x="950" y="300" font-size="28px" font-weight="bold" fill="#000000">Y</text>

        <!-- Connections & Labels -->
        <line x1="170" y1="300" x2="290" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
        <text x="230" y="270" font-size="20px" fill="#000000">-4</text>

        <line x1="330" y1="300" x2="450" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
        <text x="390" y="270" font-size="20px" fill="#000000">-4</text>

        <line x1="490" y1="300" x2="610" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
        <text x="550" y="270" font-size="20px" fill="#000000">-4</text>

        <line x1="650" y1="300" x2="770" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
        <text x="710" y="270" font-size="20px" fill="#000000">-4</text>

        <line x1="810" y1="300" x2="865" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
        <text x="837" y="270" font-size="20px" fill="#000000">-4</text>


        <!-- ================= ROW 3 & 4: NUMBERS & POWERS ================= -->
        <!-- Numbers -->
        <text x="150" y="450" font-size="28px" font-weight="bold" fill="#000000">1</text>
        <text x="310" y="450" font-size="28px" font-weight="bold" fill="#000000">8</text>
        <text x="470" y="450" font-size="28px" font-weight="bold" fill="#000000">27</text>
        <text x="630" y="450" font-size="28px" font-weight="bold" fill="#000000">64</text>
        <text x="790" y="450" font-size="28px" font-weight="bold" fill="#000000">125</text>
        
        <!-- Redacted scribbles preserving the original errors -->
        <text x="875" y="450" font-size="22px" fill="#888888" text-decoration="line-through">###</text>
        <text x="950" y="450" font-size="28px" font-weight="bold" fill="#000000">216</text>
        <text x="1025" y="450" font-size="22px" fill="#888888" text-decoration="line-through">###</text>

        <!-- Vertical Connectors -->
        <line x1="150" y1="475" x2="150" y2="535" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
        <line x1="310" y1="475" x2="310" y2="535" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
        <line x1="470" y1="475" x2="470" y2="535" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
        <line x1="630" y1="475" x2="630" y2="535" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
        <line x1="790" y1="475" x2="790" y2="535" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
        <line x1="950" y1="475" x2="950" y2="535" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

        <!-- Powers -->
        <text x="150" y="570" font-size="28px" font-weight="bold" fill="#000000">1<tspan baseline-shift="super" font-size="18px">3</tspan></text>
        <text x="310" y="570" font-size="28px" font-weight="bold" fill="#000000">2<tspan baseline-shift="super" font-size="18px">3</tspan></text>
        <text x="470" y="570" font-size="28px" font-weight="bold" fill="#000000">3<tspan baseline-shift="super" font-size="18px">3</tspan></text>
        <text x="630" y="570" font-size="28px" font-weight="bold" fill="#000000">4<tspan baseline-shift="super" font-size="18px">3</tspan></text>
        <text x="790" y="570" font-size="28px" font-weight="bold" fill="#000000">5<tspan baseline-shift="super" font-size="18px">3</tspan></text>
        <text x="950" y="570" font-size="28px" font-weight="bold" fill="#000000">6<tspan baseline-shift="super" font-size="18px">3</tspan></text>
        
    </g>
</svg>