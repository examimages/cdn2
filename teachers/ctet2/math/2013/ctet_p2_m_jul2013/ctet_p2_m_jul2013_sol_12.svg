<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 24px;">
    
    <!-- Definitions for Filters and Gradients -->
    <defs>
        <linearGradient id="bellGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#000000" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
        </filter>
    </defs>

    <!-- White Background -->
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Area Under Curve (Gradient Fill) -->
    <path d="M 100 400 L 120 399.8 L 140 399.6 L 160 399.2 L 180 398.5 L 200 397.2 L 220 395.0 L 240 391.5 L 260 386.0 L 280 377.7 L 300 366.2 L 320 350.5 L 340 330.5 L 360 306.2 L 380 278.2 L 400 248.2 L 420 218.5 L 440 191.2 L 460 169.2 L 480 155.0 L 500 150.0 L 520 155.0 L 540 169.2 L 560 191.2 L 580 218.5 L 600 248.2 L 620 278.2 L 640 306.2 L 660 330.5 L 680 350.5 L 700 366.2 L 720 377.7 L 740 386.0 L 760 391.5 L 780 395.0 L 800 397.2 L 820 398.5 L 840 399.2 L 860 399.6 L 880 399.8 L 900 400 Z" fill="url(#bellGrad)" stroke="none"/>

    <!-- Discrete Binomial Bars (Vertical Lines representing n=100, p=0.5) -->
    <path d="M 120 400 L 120 399.8 M 140 400 L 140 399.6 M 160 400 L 160 399.2 M 180 400 L 180 398.5 M 200 400 L 200 397.2 M 220 400 L 220 395.0 M 240 400 L 240 391.5 M 260 400 L 260 386.0 M 280 400 L 280 377.7 M 300 400 L 300 366.2 M 320 400 L 320 350.5 M 340 400 L 340 330.5 M 360 400 L 360 306.2 M 380 400 L 380 278.2 M 400 400 L 400 248.2 M 420 400 L 420 218.5 M 440 400 L 440 191.2 M 460 400 L 460 169.2 M 480 400 L 480 155.0 M 500 400 L 500 150.0 M 520 400 L 520 155.0 M 540 400 L 540 169.2 M 560 400 L 560 191.2 M 580 400 L 580 218.5 M 600 400 L 600 248.2 M 620 400 L 620 278.2 M 640 400 L 640 306.2 M 660 400 L 660 330.5 M 680 400 L 680 350.5 M 700 400 L 700 366.2 M 720 400 L 720 377.7 M 740 400 L 740 386.0 M 760 400 L 760 391.5 M 780 400 L 780 395.0 M 800 400 L 800 397.2 M 820 400 L 820 398.5 M 840 400 L 840 399.2 M 860 400 L 860 399.6 M 880 400 L 880 399.8" stroke="#000000" stroke-width="1.5" opacity="0.3" fill="none" stroke-linecap="round"/>

    <!-- Main Normal Distribution Curve -->
    <path d="M 100 400 L 120 399.8 L 140 399.6 L 160 399.2 L 180 398.5 L 200 397.2 L 220 395.0 L 240 391.5 L 260 386.0 L 280 377.7 L 300 366.2 L 320 350.5 L 340 330.5 L 360 306.2 L 380 278.2 L 400 248.2 L 420 218.5 L 440 191.2 L 460 169.2 L 480 155.0 L 500 150.0 L 520 155.0 L 540 169.2 L 560 191.2 L 580 218.5 L 600 248.2 L 620 278.2 L 640 306.2 L 660 330.5 L 680 350.5 L 700 366.2 L 720 377.7 L 740 386.0 L 760 391.5 L 780 395.0 L 800 397.2 L 820 398.5 L 840 399.2 L 860 399.6 L 880 399.8 L 900 400" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>

    <!-- X-Axis Base Line -->
    <line x1="50" y1="400" x2="950" y2="400" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

    <!-- X-Axis Ticks -->
    <path d="M 100 400 L 100 410 M 300 400 L 300 410 M 500 400 L 500 410 M 700 400 L 700 410 M 900 400 L 900 410" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- X-Axis Tick Labels -->
    <g font-size="20px" fill="#000000" text-anchor="middle">
        <text x="100" y="435">30</text>
        <text x="300" y="435">40</text>
        <text x="500" y="435">50</text>
        <text x="700" y="435">60</text>
        <text x="900" y="435">70</text>
    </g>

    <!-- Standard Deviation Brackets -->
    <g stroke="#000000" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <!-- Bracket 1: ±1σ -->
        <path d="M 400 420 L 400 460 L 435 460"/>
        <path d="M 565 460 L 600 460 L 600 420"/>
        
        <!-- Bracket 2: ±2σ -->
        <path d="M 300 420 L 300 500 L 435 500"/>
        <path d="M 565 500 L 700 500 L 700 420"/>
        
        <!-- Bracket 3: ±3σ -->
        <path d="M 200 420 L 200 540 L 435 540"/>
        <path d="M 565 540 L 800 540 L 800 420"/>
    </g>

    <!-- Standard Deviation Bracket Labels -->
    <g font-size="22px" font-weight="500" fill="#000000" text-anchor="middle" dominant-baseline="middle">
        <text x="500" y="460">±1<tspan font-style="italic">σ</tspan> 68.3%</text>
        <text x="500" y="500">±2<tspan font-style="italic">σ</tspan> 95.4%</text>
        <text x="500" y="540">±3<tspan font-style="italic">σ</tspan> 99.7%</text>
    </g>

    <!-- Top Title Header -->
    <text x="500" y="80" font-size="28px" font-weight="600" fill="#000000" text-anchor="middle">
        <tspan font-style="italic">p</tspan> = 0.5, 
        <tspan font-style="italic">n</tspan> = 100, 
        <tspan font-style="italic">σ</tspan> = 5
    </text>

</svg>