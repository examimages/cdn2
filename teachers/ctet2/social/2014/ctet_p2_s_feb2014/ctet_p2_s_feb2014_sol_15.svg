<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 9px;">
  <defs>
    <!-- Subtle drop shadow to provide a modern, professional layered aesthetic while remaining strictly monochrome -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="390" y="470" text-anchor="middle" font-size="24px" font-weight="bold" fill="#000000" letter-spacing="1px">Bloom's Taxonomy</text>

  <!-- Group for all shapes with drop shadow applied -->
  <g filter="url(#shadow)">
    
    <!-- LEVEL 1: Create -->
    <polygon points="150,50 248,50 248,106 131.3,106" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="252" y="50" width="498" height="56" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

    <!-- LEVEL 2: Evaluate -->
    <polygon points="130,110 248,110 248,166 111.3,166" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="252" y="110" width="498" height="56" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

    <!-- LEVEL 3: Analyze -->
    <polygon points="110,170 248,170 248,226 91.3,226" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="252" y="170" width="498" height="56" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

    <!-- LEVEL 4: Apply -->
    <polygon points="90,230 248,230 248,286 71.3,286" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="252" y="230" width="498" height="56" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

    <!-- LEVEL 5: Understand -->
    <polygon points="70,290 248,290 248,346 51.3,346" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="252" y="290" width="498" height="56" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

    <!-- LEVEL 6: Remember -->
    <polygon points="50,350 248,350 248,406 31.3,406" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="252" y="350" width="498" height="56" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  </g>

  <!-- Text Content Group -->
  <g fill="#000000">

    <!-- LEVEL 1 Text -->
    <text x="194" y="83" text-anchor="middle" font-size="16px" font-weight="bold">Create</text>
    <text x="501" y="77" text-anchor="middle" font-size="14px" font-weight="bold">Produce new or original work</text>
    <text x="501" y="94" text-anchor="middle" font-size="12px">Construct, develop, investigate</text>

    <!-- LEVEL 2 Text -->
    <text x="184" y="143" text-anchor="middle" font-size="16px" font-weight="bold">Evaluate</text>
    <text x="501" y="137" text-anchor="middle" font-size="14px" font-weight="bold">Justify a stand or decision</text>
    <text x="501" y="154" text-anchor="middle" font-size="12px">Appraise, argue, defend, judge, select, support</text>

    <!-- LEVEL 3 Text -->
    <text x="174" y="203" text-anchor="middle" font-size="16px" font-weight="bold">Analyze</text>
    <text x="501" y="197" text-anchor="middle" font-size="14px" font-weight="bold">Draw connections among ideas</text>
    <text x="501" y="214" text-anchor="middle" font-size="12px">Organize, compare, contrast, distinguish, examine, experiment</text>

    <!-- LEVEL 4 Text -->
    <text x="164" y="263" text-anchor="middle" font-size="16px" font-weight="bold">Apply</text>
    <text x="501" y="257" text-anchor="middle" font-size="14px" font-weight="bold">Use information in new situations</text>
    <text x="501" y="274" text-anchor="middle" font-size="12px">Execute, implement, solve, use, demonstrate</text>

    <!-- LEVEL 5 Text -->
    <text x="154" y="323" text-anchor="middle" font-size="16px" font-weight="bold">Understand</text>
    <text x="501" y="317" text-anchor="middle" font-size="14px" font-weight="bold">Explain ideas or concepts</text>
    <text x="501" y="334" text-anchor="middle" font-size="12px">Discuss, explain</text>

    <!-- LEVEL 6 Text -->
    <text x="144" y="383" text-anchor="middle" font-size="16px" font-weight="bold">Remember</text>
    <text x="501" y="377" text-anchor="middle" font-size="14px" font-weight="bold">Recall facts and basic concepts</text>
    <text x="501" y="394" text-anchor="middle" font-size="12px">Define, memorize, state</text>

  </g>

</svg>